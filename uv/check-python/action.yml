name: 'Python code check'
description: 'Run Python code quality tools against code'

inputs:
  python-version-file:
    description: The file containing the Python version of your project. Defaults to pyproject.toml.
    required: false
    default: pyproject.toml
  uv-version:
    description: The version of uv to install e.g., `0.5.0` Defaults to the version in pyproject.toml or 'latest'.
    default: ""
  path:
    description: 'Path to point to for checks'
    required: false
    default: '.'
  type-checker:
    description: 'The type checker to use. Either `mypy` (default) or `pyrefly`.'
    required: false
    default: mypy

# TODO: Add options to enable/disable checks for specific packages? See if I can check whether a package is installed or not before attempting to run it?

runs:
  using: 'composite'
  steps:
    - name: Validate type-checker input
      shell: bash
      env:
        TYPE_CHECKER: ${{ inputs.type-checker }}
      run: |
        if [[ "$TYPE_CHECKER" != "mypy" && "$TYPE_CHECKER" != "pyrefly" ]]; then
          echo "::error::Invalid 'type-checker' input: '$TYPE_CHECKER'. Must be 'mypy' or 'pyrefly'."
          exit 1
        fi

    - uses: actions/checkout@v6

    - name: Build Project
      uses: eshwen/adrenaline/uv/builder@v0.9.0
      with:
        python-version-file: ${{ inputs.python-version-file }}
        install-dev-deps: true
        uv-version: ${{ inputs.uv-version }}

    - id: ruff
      name: Ruff lint
      if: always()
      shell: bash
      run: uv run ruff check ${{ inputs.path }}

    - id: ruff_format
      name: Ruff format
      if: always()
      shell: bash
      run:
        uv run ruff format ${{ inputs.path }} --diff

    - id: mypy
      if: ${{ always() && inputs.type-checker == 'mypy' }}
      shell: bash
      run: uv run mypy ${{ inputs.path }}

    - id: pyrefly
      if: ${{ always() && inputs.type-checker == 'pyrefly' }}
      shell: bash
      run: uv run pyrefly check --output-format github ${{ inputs.path }}
