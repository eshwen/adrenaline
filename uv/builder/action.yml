name: Build Project
description: 'Build project with uv'

inputs:
  python-version-file:
    description: The file containing the Python version of your project. Defaults to pyproject.toml.
    required: false
    default: pyproject.toml
  python-version:
    description: The version of Python to use e.g., `3.12`. Overrides `python-version-file` when set, so it can be used in a matrix.
    required: false
    default: ""
  uv-version:
    description: The version of uv to install e.g., `0.5.0` Defaults to the version in pyproject.toml or 'latest'.
    default: ""
  install-dev-deps:
    description: 'Whether to install dev dependencies'
    required: false
    default: 'false'

runs:
  using: 'composite'

  steps:
    - uses: actions/checkout@v7
      with:
        clean: false

    # Otherwise uv uses the runner image's system Python, pinning us to whatever patch release the image ships
    - name: Use uv-managed Python only
      run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
      shell: bash

    # uv already reads requires-python from pyproject.toml, so only other version files need reading here
    - name: Resolve Python version
      id: python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        PYTHON_VERSION_FILE: ${{ inputs.python-version-file }}
      run: |
        if [[ -z "$PYTHON_VERSION" && "$(basename "$PYTHON_VERSION_FILE")" != "pyproject.toml" ]]; then
          PYTHON_VERSION=$(grep -v '^#' "$PYTHON_VERSION_FILE" | head -n 1 | tr -d '[:space:]')
        fi
        echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        # Sets UV_PYTHON, so uv uses this version rather than whichever interpreter it finds first
        python-version: ${{ steps.python.outputs.version }}
        enable-cache: true
        cache-python: true

    - name: Install Dependencies (without dev)
      run: |
        uv sync --locked --no-dev
      shell: bash
      if: ${{ inputs.install-dev-deps == 'false' }}

    - name: Install Dependencies (with dev)
      run: |
        uv sync --locked --all-groups
      shell: bash
      if: ${{ inputs.install-dev-deps == 'true' }}
