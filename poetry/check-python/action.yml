name: 'Python code check'
description: 'Run Python code quality tools against code'

inputs:
  python-version:
    description: The version of Python to use. For 3.10, remember to enclose it in quotes so it is cast as a string!
    required: true
  path:
    description: 'Path to point to for checks'
    required: false
    default: '.'
  type-checker:
    description: 'The type checker to use. Either `mypy` (default) or `pyrefly`.'
    required: false
    default: mypy

# TODO: Add options to enable/disable checks for specific packages? See if I can check whether a package is installed or not before attempting to run it?

runs:
  using: 'composite'

  steps:
    - name: Validate type-checker input
      shell: bash
      env:
        TYPE_CHECKER: ${{ inputs.type-checker }}
      run: |
        if [[ "$TYPE_CHECKER" != "mypy" && "$TYPE_CHECKER" != "pyrefly" ]]; then
          echo "::error::Invalid 'type-checker' input: '$TYPE_CHECKER'. Must be 'mypy' or 'pyrefly'."
          exit 1
        fi

    - uses: actions/checkout@v4

    - name: Build Python
      uses: eshwen/adrenaline/poetry/builder@v0.10.0
      with:
        python-version: ${{ inputs.python-version }}
        install-dev-deps: true

    - id: ruff
      name: Ruff lint
      if: always()
      shell: bash
      run: poetry run ruff check ${{ inputs.path }}

    - id: ruff_format
      name: Ruff format
      if: always()
      shell: bash
      run: poetry run ruff format ${{ inputs.path }} --diff

    - id: mypy
      if: ${{ always() && inputs.type-checker == 'mypy' }}
      shell: bash
      run: poetry run mypy ${{ inputs.path }}

    - id: pyrefly
      if: ${{ always() && inputs.type-checker == 'pyrefly' }}
      shell: bash
      run: poetry run pyrefly check --output-format github ${{ inputs.path }}
